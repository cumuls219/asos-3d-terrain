function applyRows(R,name){var M=new Map(),unk=new Set(),dup=new Set(),times=new Set(),bad=0;R.forEach(function(r){var id=Math.trunc(num(fv(r,'id')));if(!Number.isFinite(id)){bad++;return}if(!stationById.has(id)){unk.add(id);return}if(M.has(id))dup.add(id);var t=num(fv(r,'temp')),wd=num(fv(r,'wd')),ws=num(fv(r,'ws'));if(fin(wd))wd=((wd%360)+360)%360;if(fin(ws)&&ws<0)ws=NaN;var tv=fv(r,'time'),tt=tv===undefined?'':timeText(tv).trim();if(tt)times.add(tt);M.set(id,{temp:t,wd:wd,ws:ws,time:tt})});wx=M;clearTemp();clearW(wgrid);clearW(wobs);wgridOn=wobsOn=false;e('windGridBtn').textContent='바람장 OFF';e('windObsBtn').textContent='관측바람 OFF';e('windGridBtn').classList.remove('on');e('windObsBtn').classList.remove('on');S.forEach(label);var tc=0,wc=0;M.forEach(function(w){if(fin(w.temp))tc++;if(fin(w.wd)&&fin(w.ws))wc++});e('tempBtn').disabled=tc<3;e('windGridBtn').disabled=wc<3;e('windObsBtn').disabled=wc<1;var ts=times.size===0?'관측시각 미기재':times.size===1?Array.from(times)[0]:'여러 시각 '+times.size+'개';var m='<b>'+esc(name)+'</b><br>매칭 '+M.size+' / 77 · 기온 '+tc+' · 바람 '+wc+'<br>시각: '+esc(ts);if(unk.size)m+='<br>미등록 지점번호 '+Array.from(unk).slice(0,10).join(', ')+(unk.size>10?' …':'');if(dup.size)m+='<br>중복 지점 '+dup.size+'개: 마지막 행 사용';if(bad)m+='<br>지점번호 해석 불가 행 '+bad+'개';e('dataInfo').innerHTML=m;e('status').textContent='관측자료 적용 완료 · 기온 '+tc+' · 바람 '+wc;if(tc>=3)buildTemp();if(wc>=3){wgridOn=true;gridWind();e('windGridBtn').textContent='바람장 ON';e('windGridBtn').classList.add('on')}}
async function load(f){try{var ext=f.name.toLowerCase().split('.').pop(),R=[];if(ext==='csv'||ext==='txt')R=csv(await f.text());else{if(typeof XLSX==='undefined')throw new Error('XLSX 라이브러리를 불러오지 못했습니다. CSV 형식은 별도 라이브러리 없이 가능합니다.');var b=XLSX.read(await f.arrayBuffer(),{type:'array',cellDates:false});b.SheetNames.forEach(n=>R=R.concat(XLSX.utils.sheet_to_json(b.Sheets[n],{defval:''})))}if(!R.length)throw new Error('읽을 수 있는 데이터 행이 없습니다.');applyRows(R,f.name)}catch(x){err(x,'관측자료 읽기')}}
function template(){var H=['관측망','지점번호','지점명','관측시각','기온','풍향','풍속'],L=[H.join(',')];S.forEach(s=>L.push([s.type,s.id,'"'+String(s.name).replace(/"/g,'""')+'"','','','',''].join(',')));var b=new Blob(['\ufeff'+L.join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='기온_바람_입력양식_77지점.csv';document.body.appendChild(a);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);a.remove()}

function install(){if(ready)return;ready=true;viewer=ws3d.viewer;terrainMode();resolveB(0);fillSelect();S.forEach(addStation);e('collapse').onclick=function(){var c=e('panel').classList.toggle('collapsed');this.textContent=c?'⌄':'⌃'};e('file').onchange=function(){if(this.files&&this.files[0])load(this.files[0])};e('template').onclick=template;e('asosBtn').onclick=()=>network('ASOS',!shown.ASOS);e('awsBtn').onclick=()=>network('AWS',!shown.AWS);e('satBtn').onclick=()=>satellite(!sat);e('bldBtn').onclick=()=>buildings(!bldOn);e('homeBtn').onclick=home;e('stationSelect').onchange=function(){var p=this.value.split('-'),s=S.find(x=>x.type===p[0]&&x.id===Number(p[1]));if(s)fly(s)};e('tempBtn').onclick=function(){if(tempOn)clearTemp();else buildTemp()};e('windGridBtn').onclick=function(){wgridOn=!wgridOn;if(wgridOn){if(gridWind()){this.textContent='바람장 ON';this.classList.add('on')}}else{clearW(wgrid);this.textContent='바람장 OFF';this.classList.remove('on')}};e('windObsBtn').onclick=function(){wobsOn=!wobsOn;if(wobsOn){obsWind();this.textContent='관측바람 ON';this.classList.add('on')}else{clearW(wobs);this.textContent='관측바람 OFF';this.classList.remove('on')}};e('alpha').oninput=function(){e('aval').textContent=Math.round(Number(this.value)*100)+'%';if(tempLayer)tempLayer.alpha=Number(this.value)};e('wscale').oninput=function(){e('wval').textContent=Number(this.value).toFixed(1)+'×';if(wgridOn)gridWind();if(wobsOn)obsWind()};e('popupClose').onclick=()=>e('popup').style.display='none';var h=new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);h.setInputAction(function(c){e('popup').style.display='none';var p=viewer.scene.pick(c.position);if(!Cesium.defined(p)||!p.id)return;var i=Number(p.id.__idx);if(Number.isFinite(i)&&S[i])popup(c,S[i])},Cesium.ScreenSpaceEventType.LEFT_CLICK);e('status').textContent='분석모드 · 위성 OFF · 지형 ON · 관측자료를 불러오세요';setTimeout(home,500)}

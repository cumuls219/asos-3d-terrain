<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>부산관할 ASOS Active 3D 지형지도</title>
<script type="text/javascript" src="https://map.vworld.kr/js/webglMapInit.js.do?version=3.0&apiKey=CD9939DD-4087-326C-A1F8-F077628FF9FB"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;font-family:"Malgun Gothic","Noto Sans KR",sans-serif}
#map{position:absolute;inset:0;width:100%;height:100%}
#asosPanel{position:absolute;z-index:1000;top:14px;right:14px;width:min(320px,calc(100% - 28px));box-sizing:border-box;padding:14px;border:1px solid rgba(255,255,255,.18);border-radius:15px;background:rgba(7,17,31,.78);color:#fff;backdrop-filter:blur(12px)}
#asosPanel h1{margin:0 0 4px;font-size:16px} #asosPanel .sub{font-size:11px;color:#cbd5e1;margin-bottom:8px}
#asosPanel select,#asosPanel button{box-sizing:border-box;width:100%;min-height:40px;margin-top:7px;border:1px solid rgba(255,255,255,.18);border-radius:9px;background:#0f172a;color:#fff}
#asosActions{display:grid;grid-template-columns:1fr 1fr;gap:7px}
#asosStatus{position:absolute;z-index:1100;left:12px;bottom:12px;padding:8px 11px;border-radius:10px;background:rgba(7,17,31,.82);color:#fff;font-size:11px}
#asosPopup{display:none;position:absolute;z-index:1200;width:330px;max-width:calc(100% - 20px);box-sizing:border-box;padding:12px;border:1px solid rgba(255,255,255,.16);border-radius:13px;background:rgba(7,17,31,.93);color:#fff}
#asosPopupClose{float:right;width:auto;min-height:28px;padding:3px 8px} #asosPopup table{width:100%;border-collapse:collapse;font-size:11px} #asosPopup th,#asosPopup td{padding:6px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left;vertical-align:top} #asosPopup th{width:28%;color:#cbd5e1}
#asosError{display:none;position:absolute;z-index:9999;inset:0;align-items:center;justify-content:center;padding:20px;background:rgba(2,6,23,.94);color:#fff} #asosErrorCard{width:min(760px,100%);max-height:80vh;overflow:auto;padding:20px;border-radius:16px;background:#0f172a} #asosErrorStack{white-space:pre-wrap;word-break:break-word;font-size:11px;color:#fca5a5;background:#020617;padding:10px;border-radius:8px}
@media(max-width:620px){#asosPanel{left:8px;right:8px;top:8px;width:auto}}
</style>
</head>
<body>
<div id="map"></div>
<div id="asosPanel">
  <h1>부산관할 ASOS Active 3D 지형지도</h1>
  <div class="sub">V-World WebGL 3D · ASOS 17개 지점</div>
  <select id="asosStationSelect"><option value="">관측소를 선택하세요</option></select>
  <div id="asosActions"><button id="asosHome" type="button">전체 지점</button><button id="asosTerrain" type="button">3D 지형 ON</button></div>
</div>
<div id="asosStatus">V-World 3D 지형 초기화 중…</div>
<div id="asosPopup"><button id="asosPopupClose" type="button">닫기</button><div id="asosPopupContent"></div></div>
<div id="asosError"><div id="asosErrorCard"><h2>V-World 3D 지도 초기화 실패</h2><div id="asosErrorMessage"></div><pre id="asosErrorStack"></pre></div></div>
<script>
(function () {
"use strict";

/*
 중요: 이 파일은 애플리케이션 코드를 함수 스코프 안에 격리합니다.
 V-World 내부와 충돌할 수 있는 전역 '$', 'viewer', 'options' 등을 만들지 않습니다.
*/
var stationData = [{"지점번호":152,"지점명":"울산","주소":"울산광역시 중구 약사동 308","위도":35.58237,"경도":129.33469,"높이":81.14},{"지점번호":155,"지점명":"창원","주소":"경상남도 창원시 마산합포구 가포동 473-1","위도":35.17019,"경도":128.57282,"높이":34.97},{"지점번호":159,"지점명":"부산","주소":"부산광역시 중구 대청동1가 9-305","위도":35.10468,"경도":129.03203,"높이":69.56},{"지점번호":162,"지점명":"통영","주소":"경상남도 통영시 정량동 844","위도":34.84541,"경도":128.43561,"높이":31.24},{"지점번호":192,"지점명":"진주","주소":"경상남도 진주시 평거동 695-244","위도":35.16378,"경도":128.04004,"높이":29.35},{"지점번호":253,"지점명":"김해시","주소":"경상남도 김해시 부원동 112-3","위도":35.22981,"경도":128.89075,"높이":54.59},{"지점번호":255,"지점명":"북창원","주소":"경상남도 창원시 성산구 내동 산27-10","위도":35.22655,"경도":128.6726,"높이":50.95},{"지점번호":257,"지점명":"양산시","주소":"경상남도 양산시 동면 금산리 1501","위도":35.30737,"경도":129.02009,"높이":6.29},{"지점번호":263,"지점명":"의령군","주소":"경상남도 의령군 의령읍 무전리 78","위도":35.32258,"경도":128.28812,"높이":14.1},{"지점번호":264,"지점명":"함양군","주소":"경상남도 함양군 함양읍 용평리 915-63","위도":35.51138,"경도":127.74538,"높이":152.07},{"지점번호":284,"지점명":"거창","주소":"경상남도 거창군 거창읍 정장리 967-8","위도":35.66739,"경도":127.9099,"높이":228.45},{"지점번호":285,"지점명":"합천","주소":"경상남도 합천군 합천읍 합천리 129-4","위도":35.56505,"경도":128.16994,"높이":26.72},{"지점번호":288,"지점명":"밀양","주소":"경상남도 밀양시 내이동 1073-3","위도":35.49147,"경도":128.74412,"높이":8.31},{"지점번호":289,"지점명":"산청","주소":"경상남도 산청군 산청읍 지리 311-2","위도":35.413,"경도":127.8791,"높이":138.22},{"지점번호":294,"지점명":"거제","주소":"경상남도 거제시 장평동 770-27","위도":34.88818,"경도":128.60459,"높이":44.83},{"지점번호":295,"지점명":"남해","주소":"경상남도 남해군 이동면 다정리 797-2","위도":34.81662,"경도":127.92641,"높이":45.71},{"지점번호":296,"지점명":"북부산","주소":"부산광역시 강서구 대저1동 1246","위도":35.217781,"경도":128.960242,"높이":3.0}];

function byId(id) { return document.getElementById(id); }
function escapeText(value) {
  return String(value == null ? "" : value)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function showError(err, stage) {
  byId("asosErrorMessage").innerHTML =
    "<p><b>단계: "+escapeText(stage)+"</b></p><p><b>"+escapeText(err && err.message ? err.message : err)+"</b></p>";
  byId("asosErrorStack").textContent = err && err.stack ? err.stack : "stack 정보 없음";
  byId("asosError").style.display = "flex";
}

var stations = stationData.map(function(s, i) {
  return {
    index:i, id:Number(s["지점번호"]), name:String(s["지점명"]), address:String(s["주소"]),
    lat:Number(s["위도"]), lon:Number(s["경도"]), height:Number(s["높이"])
  };
});
var lats=stations.map(function(s){return s.lat;}), lons=stations.map(function(s){return s.lon;});
var centerLat=(Math.min.apply(null,lats)+Math.max.apply(null,lats))/2;
var centerLon=(Math.min.apply(null,lons)+Math.max.apply(null,lons))/2;
var homeHeight=300000;
var viewerRef=null, originalTerrain=null, terrainOn=true, uiReady=false;

function installStationUi() {
  if (uiReady) return;
  uiReady=true;
  viewerRef=ws3d.viewer;
  originalTerrain=viewerRef.terrainProvider;

  var select=byId("asosStationSelect");
  stations.forEach(function(s) {
    var option=document.createElement("option");
    option.value=String(s.index);
    option.textContent=s.id+" · "+s.name;
    select.appendChild(option);

    var entity=viewerRef.entities.add({
      id:"asos-"+s.id,
      name:s.name,
      position:Cesium.Cartesian3.fromDegrees(s.lon,s.lat,0),
      point:{
        pixelSize:13,color:Cesium.Color.CYAN,outlineColor:Cesium.Color.WHITE,outlineWidth:2,
        heightReference:Cesium.HeightReference.CLAMP_TO_GROUND,
        disableDepthTestDistance:Number.POSITIVE_INFINITY
      },
      label:{
        text:s.id+" "+s.name,font:"700 13px Malgun Gothic",fillColor:Cesium.Color.WHITE,
        outlineColor:Cesium.Color.BLACK,outlineWidth:3,style:Cesium.LabelStyle.FILL_AND_OUTLINE,
        pixelOffset:new Cesium.Cartesian2(0,-22),verticalOrigin:Cesium.VerticalOrigin.BOTTOM,
        heightReference:Cesium.HeightReference.CLAMP_TO_GROUND,
        disableDepthTestDistance:Number.POSITIVE_INFINITY
      }
    });
    entity.__asosIndex=s.index;
  });

  byId("asosHome").addEventListener("click",function(){
    viewerRef.camera.flyTo({
      destination:Cesium.Cartesian3.fromDegrees(centerLon,centerLat,homeHeight),
      orientation:{heading:0,pitch:Cesium.Math.toRadians(-50),roll:0},duration:1.3
    });
  });

  select.addEventListener("change",function(e){
    var idx=Number(e.target.value);
    var target=stations.filter(function(s){return s.index===idx;})[0];
    if(!target)return;
    viewerRef.camera.flyTo({
      destination:Cesium.Cartesian3.fromDegrees(target.lon,target.lat,5000),
      orientation:{heading:0,pitch:Cesium.Math.toRadians(-42),roll:0},duration:1.4
    });
  });

  byId("asosTerrain").addEventListener("click",function(){
    terrainOn=!terrainOn;
    viewerRef.terrainProvider=terrainOn?originalTerrain:new Cesium.EllipsoidTerrainProvider();
    byId("asosTerrain").textContent=terrainOn?"3D 지형 ON":"3D 지형 OFF";
  });

  byId("asosPopupClose").addEventListener("click",function(){byId("asosPopup").style.display="none";});

  var handler=new Cesium.ScreenSpaceEventHandler(viewerRef.scene.canvas);
  handler.setInputAction(function(click){
    var picked=viewerRef.scene.pick(click.position);
    if(!Cesium.defined(picked)||!picked.id)return;
    var idx=Number(picked.id.__asosIndex);
    if(!Number.isFinite(idx))return;
    var s=stations.filter(function(v){return v.index===idx;})[0];
    if(!s)return;
    byId("asosPopupContent").innerHTML="<b>"+escapeText(s.id+" · "+s.name)+"</b><table>"+
      "<tr><th>주소</th><td>"+escapeText(s.address)+"</td></tr>"+
      "<tr><th>위도</th><td>"+s.lat.toFixed(6)+"</td></tr>"+
      "<tr><th>경도</th><td>"+s.lon.toFixed(6)+"</td></tr>"+
      "<tr><th>높이</th><td>"+s.height.toFixed(2)+" m</td></tr></table>";
    var popup=byId("asosPopup");
    popup.style.display="block";
    popup.style.left=Math.max(8,Math.min(click.position.x+12,window.innerWidth-350))+"px";
    popup.style.top=Math.max(8,Math.min(click.position.y+12,window.innerHeight-240))+"px";
  },Cesium.ScreenSpaceEventType.LEFT_CLICK);

  byId("asosStatus").textContent="V-World 3D 지형 · ASOS 17개 지점 활성화";
}

try {
  if(typeof vw==="undefined") throw new Error("V-World API 스크립트가 로드되지 않았습니다.");

  vw.ws3dInitCallBack=function(){
    try { installStationUi(); } catch(err) { showError(err,"ASOS 레이어 초기화"); }
  };

  var mapOptions={
    mapId:"map",
    initPosition:new vw.CameraPosition(
      new vw.CoordZ(centerLon,centerLat,homeHeight),
      new vw.Direction(0,-90,0)
    ),
    logo:true,
    navigation:true
  };

  var mapInstance=new vw.Map();
  mapInstance.setOption(mapOptions);
  mapInstance.start();

  // 콜백이 누락되는 환경을 대비하되, V-World 로딩 완료 후만 접근
  window.setTimeout(function(){
    try {
      if(!uiReady && typeof ws3d!=="undefined" && ws3d.viewer) installStationUi();
    } catch(err) { showError(err,"지연 초기화"); }
  },1500);

} catch(err) {
  showError(err,"V-World map.start()");
}
})();
</script>
</body>
</html>

<body>
<div id="vmap"></div>

<section id="panel" class="glass">
  <div class="title"><span class="title-dot"></span>부산관할 ASOS Active 3D 지형지도</div>
  <div class="subtitle">17개 ASOS 위치 · V-World WebGL 3D 지형</div>

  <label for="stationSelect">관측소 바로가기</label>
  <select id="stationSelect">
    <option value="">관측소를 선택하세요</option>
  </select>

  <div class="row">
    <button id="homeBtn" type="button">전체 지점 보기</button>
    <button id="terrainBtn" type="button" class="on">3D 지형 ON</button>
  </div>

  <div class="help">
    <b>지도 조작</b><br>
    · 좌클릭 드래그: 회전/이동<br>
    · 마우스 휠: 확대·축소<br>
    · 우클릭 드래그: 지형 기울이기(Pitch)<br>
    · Shift + 좌클릭 드래그: 지형 기울이기<br>
    · 관측소 마커 클릭: 지점 기본정보 확인
  </div>
</section>

<div id="status" class="glass">초기화 준비 중…</div>

<aside id="popup" class="glass">
  <div class="popup-head">
    <div id="popupTitle"></div>
    <button id="closePopup" type="button">닫기</button>
  </div>
  <div id="popupBody"></div>
</aside>

<div id="fatal">
  <div id="fatalBox" class="glass">
    <h2>V-World 3D 지도를 불러오지 못했습니다.</h2>
    <div id="fatalText"></div>
  </div>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);

const STATIONS = WEATHER_STATIONS
  .map((s,i)=>({
    index:i,
    id:Number(s["지점번호"]),
    name:String(s["지점명"] || ""),
    address:String(s["주소"] || ""),
    lat:Number(s["위도"]),
    lon:Number(s["경도"]),
    height:Number(s["높이"])
  }))
  .filter(s => Number.isFinite(s.lat) && Number.isFinite(s.lon));

function esc(v) {
  return String(v ?? "")
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function homeView() {
  const lats=STATIONS.map(s=>s.lat), lons=STATIONS.map(s=>s.lon);
  const minLat=Math.min(...lats), maxLat=Math.max(...lats);
  const minLon=Math.min(...lons), maxLon=Math.max(...lons);
  const lat=(minLat+maxLat)/2, lon=(minLon+maxLon)/2;
  const latKm=(maxLat-minLat)*111;
  const lonKm=(maxLon-minLon)*111*Math.cos(lat*Math.PI/180);
  const span=Math.max(latKm,lonKm,30);
  return {
    lat,lon,
    height:Math.min(Math.max(span*2300,100000),500000),
    heading:0,
    pitch:-50
  };
}
const HOME=homeView();

let map=null, viewer=null, originalTerrain=null, terrainOn=true;
const entities=[];

function status(text) { $("status").textContent=text; }
function fatal(text) {
  $("fatalText").innerHTML=text;
  $("fatal").style.display="flex";
}

function populateSelect() {
  const sel=$("stationSelect");
  STATIONS.forEach(s=>{
    const o=document.createElement("option");
    o.value=String(s.index);
    o.textContent=`${s.id} · ${s.name}`;
    sel.appendChild(o);
  });
}

function flyHome(duration=1.5) {
  viewer.camera.flyTo({
    destination:Cesium.Cartesian3.fromDegrees(HOME.lon,HOME.lat,HOME.height),
    orientation:{
      heading:Cesium.Math.toRadians(HOME.heading),
      pitch:Cesium.Math.toRadians(HOME.pitch),
      roll:0
    },
    duration
  });
}

function flyToStation(s) {
  viewer.camera.flyTo({
    destination:Cesium.Cartesian3.fromDegrees(s.lon,s.lat,5000),
    orientation:{
      heading:Cesium.Math.toRadians(0),
      pitch:Cesium.Math.toRadians(-42),
      roll:0
    },
    duration:1.6
  });
}

function addStations() {
  STATIONS.forEach(s=>{
    const e=viewer.entities.add({
      id:`asos-${s.id}`,
      name:s.name,
      position:Cesium.Cartesian3.fromDegrees(s.lon,s.lat,0),
      point:{
        pixelSize:13,
        color:Cesium.Color.fromCssColorString("#38bdf8"),
        outlineColor:Cesium.Color.WHITE,
        outlineWidth:2,
        heightReference:Cesium.HeightReference.CLAMP_TO_GROUND,
        disableDepthTestDistance:Number.POSITIVE_INFINITY,
        scaleByDistance:new Cesium.NearFarScalar(1000,1.2,300000,.55)
      },
      label:{
        text:`${s.id} ${s.name}`,
        font:"700 13px 'Malgun Gothic', sans-serif",
        fillColor:Cesium.Color.WHITE,
        outlineColor:Cesium.Color.BLACK,
        outlineWidth:3,
        style:Cesium.LabelStyle.FILL_AND_OUTLINE,
        showBackground:true,
        backgroundColor:Cesium.Color.fromCssColorString("#0f172a").withAlpha(.7),
        backgroundPadding:new Cesium.Cartesian2(6,4),
        pixelOffset:new Cesium.Cartesian2(0,-24),
        verticalOrigin:Cesium.VerticalOrigin.BOTTOM,
        heightReference:Cesium.HeightReference.CLAMP_TO_GROUND,
        disableDepthTestDistance:Number.POSITIVE_INFINITY,
        distanceDisplayCondition:new Cesium.DistanceDisplayCondition(0,260000)
      }
    });
    e.__stationIndex=s.index;
    entities.push(e);
  });
}

function showPopup(pos,s) {
  $("popupTitle").textContent=`${s.id} · ${s.name}`;
  $("popupBody").innerHTML=`
    <table class="info">
      <tr><th>지점번호</th><td>${esc(s.id)}</td></tr>
      <tr><th>지점명</th><td>${esc(s.name)}</td></tr>
      <tr><th>주소</th><td>${esc(s.address)}</td></tr>
      <tr><th>위도</th><td>${esc(s.lat.toFixed(6))}</td></tr>
      <tr><th>경도</th><td>${esc(s.lon.toFixed(6))}</td></tr>
      <tr><th>높이</th><td>${esc(s.height.toFixed(2))} m</td></tr>
    </table>
  `;
  const p=$("popup");
  p.style.display="block";
  requestAnimationFrame(()=>{
    const r=p.getBoundingClientRect(), m=10;
    let x=pos.x+14, y=pos.y+14;
    if(x+r.width>innerWidth-m) x=pos.x-r.width-14;
    if(y+r.height>innerHeight-m) y=innerHeight-r.height-m;
    x=Math.max(m,Math.min(x,innerWidth-r.width-m));
    y=Math.max(m,Math.min(y,innerHeight-r.height-m));
    p.style.left=x+"px"; p.style.top=y+"px";
  });
}

function hidePopup() { $("popup").style.display="none"; }

function setupCamera() {
  const c=viewer.scene.screenSpaceCameraController;
  c.enableRotate=true;
  c.enableTranslate=true;
  c.enableZoom=true;
  c.enableTilt=true;
  c.enableLook=true;
  c.rotateEventTypes=[Cesium.CameraEventType.LEFT_DRAG];
  c.tiltEventTypes=[
    Cesium.CameraEventType.RIGHT_DRAG,
    {
      eventType:Cesium.CameraEventType.LEFT_DRAG,
      modifier:Cesium.KeyboardEventModifier.SHIFT
    }
  ];
  c.zoomEventTypes=[Cesium.CameraEventType.WHEEL];
  c.minimumZoomDistance=10;
  c.maximumZoomDistance=25000000;
}

function toggleTerrain() {
  terrainOn=!terrainOn;
  const b=$("terrainBtn");
  try {
    viewer.terrainProvider=terrainOn
      ? originalTerrain
      : new Cesium.EllipsoidTerrainProvider();
  } catch(err) {
    console.warn(err);
  }
  b.classList.toggle("on",terrainOn);
  b.textContent=terrainOn ? "3D 지형 ON" : "3D 지형 OFF";
  status(terrainOn ? "3D 입체지형을 표시합니다." : "평탄 지형으로 표시합니다.");
}

function setupPicking() {
  const h=new Cesium.ScreenSpaceEventHandler(viewer.scene.canvas);
  h.setInputAction(m=>{
    hidePopup();
    const picked=viewer.scene.pick(m.position);
    if(!Cesium.defined(picked) || !picked.id) return;
    const idx=Number(picked.id.__stationIndex);
    if(!Number.isFinite(idx)) return;
    const s=STATIONS.find(v=>v.index===idx);
    if(s) showPopup(m.position,s);
  },Cesium.ScreenSpaceEventType.LEFT_CLICK);
}


let appInitialized = false;
let scriptLoaded = false;
let initTimeout = null;

function initializeViewerOnce() {
  if (appInitialized) return true;

  // 공식 V-World WebGL 3.0 예제처럼 ws3d.viewer를 직접 사용합니다.
  if (typeof ws3d === "undefined" || !ws3d || !ws3d.viewer) return false;
  if (typeof Cesium === "undefined") return false;

  viewer = ws3d.viewer;
  appInitialized = true;

  try {
    originalTerrain = viewer.terrainProvider;
    viewer.scene.globe.depthTestAgainstTerrain = true;

    setupCamera();
    populateSelect();
    addStations();
    setupPicking();

    $("homeBtn").addEventListener("click", () => flyHome());
    $("terrainBtn").addEventListener("click", toggleTerrain);
    $("closePopup").addEventListener("click", hidePopup);

    $("stationSelect").addEventListener("change", e => {
      const idx = Number(e.target.value);
      const s = STATIONS.find(v => v.index === idx);
      if (s) flyToStation(s);
    });

    status(`부산관할 ASOS ${STATIONS.length}개 지점을 표시했습니다.`);
    setTimeout(() => flyHome(1.1), 450);

    if (initTimeout) {
      clearTimeout(initTimeout);
      initTimeout = null;
    }
    return true;
  } catch (err) {
    console.error(err);
    fatal(
      "<p><b>3D 지도 객체는 생성되었지만 초기 설정 중 오류가 발생했습니다.</b></p>" +
      "<p>" + esc(err && err.message ? err.message : err) + "</p>"
    );
    return false;
  }
}

function createVWorldMap() {
  try {
    if (typeof vw === "undefined" || !vw.Map) {
      throw new Error("V-World API 객체(vw.Map)가 없습니다.");
    }

    status("V-World 3D 엔진을 시작하는 중…");

    map = new vw.Map();

    map.setOption({
      mapId: "vmap",
      initPosition: new vw.CameraPosition(
        new vw.CoordZ(HOME.lon, HOME.lat, HOME.height),
        new vw.Direction(HOME.heading, HOME.pitch, 0)
      ),
      logo: true,
      navigation: true
    });

    // 3D 로딩 완료 시 실행
    vw.ws3dInitCallBack = function () {
      initializeViewerOnce();
    };

    map.start();

    // V-World 공식 샘플에서는 map.start() 직후 ws3d.viewer 사용이 가능합니다.
    // 콜백을 기다리기만 하지 않고 즉시/반복 확인합니다.
    initializeViewerOnce();

    let tries = 0;
    const poll = setInterval(() => {
      tries += 1;
      if (initializeViewerOnce() || tries >= 80) {
        clearInterval(poll);
      }
    }, 100);

    initTimeout = setTimeout(() => {
      if (!appInitialized) {
        fatal(
          "<p><b>V-World 스크립트는 로드됐지만 3D 엔진이 초기화되지 않았습니다.</b></p>" +
          "<p>가장 흔한 원인은 <b>API 키와 등록 서비스 URL 불일치</b>입니다.</p>" +
          "<p>또한 ChatGPT의 HTML 미리보기에서는 외부 WebGL/API 실행이 제한될 수 있습니다. " +
          "파일을 다운로드한 뒤 Chrome/Edge에서 열거나, 등록된 웹서버 주소에서 실행하세요.</p>"
        );
      }
    }, 10000);

  } catch (err) {
    console.error(err);
    fatal(
      "<p><b>V-World 지도 생성 중 오류가 발생했습니다.</b></p>" +
      "<p>" + esc(err && err.message ? err.message : err) + "</p>"
    );
  }
}

function loadVWorldScript() {
  // API 키가 비어 있으면 외부 요청부터 하지 않고 즉시 정확한 안내를 표시
  if (!API_KEY || API_KEY === "YOUR_VWORLD_API_KEY") {
    status("V-World API 키가 필요합니다.");
    fatal(
      '<p><b>아직 V-World API 키가 입력되지 않았습니다.</b></p>' +
      '<p>HTML 파일 상단의 <code>const API_KEY = "YOUR_VWORLD_API_KEY";</code>를 ' +
      '발급받은 WebGL 3D API 키로 교체해야 실제 지형이 표시됩니다.</p>' +
      '<p>공개 웹페이지로 운영할 경우 V-World에 <b>실제 서비스 도메인</b>도 등록해야 합니다.</p>'
    );
    return;
  }

  status("V-World API를 불러오는 중…");

  const script = document.createElement("script");
  script.type = "text/javascript";
  script.src =
    "https://map.vworld.kr/js/webglMapInit.js.do?version=3.0&apiKey=" +
    encodeURIComponent(API_KEY) +
    "&domain=" +
    encodeURIComponent(SERVICE_DOMAIN);

  script.onload = () => {
    scriptLoaded = true;
    createVWorldMap();
  };

  script.onerror = () => {
    fatal(
      "<p><b>V-World API 스크립트를 내려받지 못했습니다.</b></p>" +
      "<p>인터넷 연결, 방화벽/기관망 정책, API 키 및 서비스 URL을 확인하세요.</p>"
    );
  };

  document.head.appendChild(script);

  setTimeout(() => {
    if (!scriptLoaded) {
      fatal(
        "<p><b>V-World API 응답이 없습니다.</b></p>" +
        "<p>ChatGPT 미리보기에서 실행 중이라면 파일을 내려받아 Chrome/Edge에서 여세요. " +
        "실제 운영은 등록된 웹주소(HTTPS/HTTP 서버)에서 실행하는 것을 권장합니다.</p>"
      );
    }
  }, 8000);
}

window.addEventListener("load", loadVWorldScript);

</script>

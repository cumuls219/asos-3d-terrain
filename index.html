<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>부산관할 ASOS·AWS Active 3D 지형지도</title>

<!-- V-World WebGL 3D API 3.0 개발키 -->
<script type="text/javascript"
src="https://map.vworld.kr/js/webglMapInit.js.do?version=3.0&apiKey=CD9939DD-4087-326C-A1F8-F077628FF9FB"></script>

<style>
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:#07111f;
  font-family:"Malgun Gothic","Noto Sans KR",Arial,sans-serif
}
#map{position:absolute;inset:0;width:100%;height:100%}

#stationPanel{
  position:absolute;z-index:1000;top:14px;right:14px;
  width:min(350px,calc(100% - 28px));box-sizing:border-box;
  padding:15px;border:1px solid rgba(255,255,255,.18);border-radius:16px;
  background:rgba(7,17,31,.80);color:#fff;backdrop-filter:blur(13px);
  box-shadow:0 16px 46px rgba(0,0,0,.24)
}
#stationPanel h1{margin:0 0 4px;font-size:16px}
#stationPanel .sub{font-size:11px;color:#cbd5e1;margin-bottom:10px;line-height:1.5}

#stationSelect,#stationPanel button{
  box-sizing:border-box;width:100%;min-height:40px;
  border:1px solid rgba(255,255,255,.18);border-radius:9px;
  background:#0f172a;color:#fff
}
#stationSelect{padding:0 10px;margin-bottom:8px}
#stationPanel button{cursor:pointer;font-weight:700;font-size:12px}
#stationPanel button:hover{border-color:rgba(255,255,255,.45)}

#legend{
  display:flex;align-items:center;gap:15px;flex-wrap:wrap;
  padding:8px 9px;margin-bottom:9px;border-radius:9px;
  background:rgba(255,255,255,.055);font-size:11px;color:#e2e8f0
}
.legendItem{display:flex;align-items:center;gap:6px}
.asosDot{
  width:11px;height:11px;border-radius:50%;
  background:#38bdf8;border:2px solid #fff;box-sizing:border-box
}
.awsDiamond{
  width:10px;height:10px;transform:rotate(45deg);
  background:#fb923c;border:1.5px solid #fff;box-sizing:border-box
}

#toggleGrid{
  display:grid;grid-template-columns:1fr 1fr;gap:7px
}
#toggleGrid .wide{grid-column:1 / -1}

.toggleBtn.on.asos{
  background:rgba(14,165,233,.27);
  border-color:rgba(56,189,248,.90)
}
.toggleBtn.on.aws{
  background:rgba(234,88,12,.27);
  border-color:rgba(251,146,60,.90)
}
.toggleBtn.on.base{
  background:rgba(34,197,94,.18);
  border-color:rgba(74,222,128,.65)
}

#stationStatus{
  position:absolute;z-index:1100;left:12px;bottom:12px;
  padding:8px 11px;border-radius:10px;
  background:rgba(7,17,31,.84);color:#fff;font-size:11px
}

#stationPopup{
  display:none;position:absolute;z-index:1200;width:345px;
  max-width:calc(100% - 20px);box-sizing:border-box;padding:12px;
  border:1px solid rgba(255,255,255,.16);border-radius:13px;
  background:rgba(7,17,31,.94);color:#fff
}
#stationPopupClose{
  float:right;width:auto;min-height:28px;padding:3px 8px;
  border:1px solid rgba(255,255,255,.2);border-radius:7px;
  background:#0f172a;color:#fff;cursor:pointer
}
#stationPopup table{width:100%;border-collapse:collapse;font-size:11px}
#stationPopup th,#stationPopup td{
  padding:6px;border-bottom:1px solid rgba(255,255,255,.08);
  text-align:left;vertical-align:top
}
#stationPopup th{width:28%;color:#cbd5e1}

.typeBadge{
  display:inline-block;margin-left:6px;padding:2px 6px;border-radius:999px;
  font-size:10px;font-weight:800;vertical-align:1px
}
.typeBadge.asos{background:rgba(14,165,233,.25);color:#bae6fd}
.typeBadge.aws{background:rgba(234,88,12,.25);color:#fed7aa}

#stationError{
  display:none;position:absolute;z-index:9999;inset:0;
  align-items:center;justify-content:center;padding:20px;
  background:rgba(2,6,23,.94);color:#fff
}
#stationErrorCard{
  width:min(760px,100%);max-height:80vh;overflow:auto;
  padding:20px;border-radius:16px;background:#0f172a
}
#stationErrorStack{
  white-space:pre-wrap;word-break:break-word;font-size:11px;
  color:#fca5a5;background:#020617;padding:10px;border-radius:8px
}

@media(max-width:620px){
  #stationPanel{left:8px;right:8px;top:8px;width:auto}
}
</style>
</head>

<body>
<div id="map"></div>

<div id="stationPanel">
  <h1>부산관할 ASOS·AWS Active 3D 지형지도</h1>

  <select id="stationSelect">
    <option value="">관측소를 선택하세요</option>
  </select>

  <div id="legend">
    <span class="legendItem"><span class="asosDot"></span>ASOS 17</span>
    <span class="legendItem"><span class="awsDiamond"></span>AWS 60</span>
  </div>

  <div id="toggleGrid">
    <button id="asosToggle" class="toggleBtn on asos" type="button">ASOS ON</button>
    <button id="awsToggle" class="toggleBtn on aws" type="button">AWS ON</button>
    <button id="terrainToggle" class="toggleBtn on base" type="button">3D 지형 ON</button>
    <button id="buildingToggle" class="toggleBtn on base" type="button">3D 건물 ON</button>
    <button id="homeButton" class="wide" type="button">전체 77개 지점 보기</button>
  </div>
</div>

<div id="stationStatus">V-World 3D 지형 초기화 중…</div>

<div id="stationPopup">
  <button id="stationPopupClose" type="button">닫기</button>
  <div id="stationPopupContent"></div>
</div>

<div id="stationError">
  <div id="stationErrorCard">
    <h2>V-World 3D 지도 초기화 실패</h2>
    <div id="stationErrorMessage"></div>
    <pre id="stationErrorStack"></pre>
  </div>
</div>

function byId(id){ return document.getElementById(id); }

function escapeText(value){
  return String(value == null ? "" : value)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function showError(err,stage){
  byId("stationErrorMessage").innerHTML =
    "<p><b>단계: "+escapeText(stage)+"</b></p>"+
    "<p><b>"+escapeText(err && err.message ? err.message : err)+"</b></p>";
  byId("stationErrorStack").textContent =
    err && err.stack ? err.stack : "stack 정보 없음";
  byId("stationError").style.display="flex";
}

var stations = rawStations.map(function(s,i){
  return {
    index:i,
    type:String(s["구분"]),
    id:Number(s["지점번호"]),
    name:String(s["지점명"]),
    address:String(s["주소"]),
    lat:Number(s["위도"]),
    lon:Number(s["경도"]),
    height:Number(s["높이"])
  };
});

var lats=stations.map(function(s){return s.lat;});
var lons=stations.map(function(s){return s.lon;});
var centerLat=(Math.min.apply(null,lats)+Math.max.apply(null,lats))/2;
var centerLon=(Math.min.apply(null,lons)+Math.max.apply(null,lons))/2;
var latSpan=(Math.max.apply(null,lats)-Math.min.apply(null,lats))*111;
var lonSpan=(Math.max.apply(null,lons)-Math.min.apply(null,lons))*111*Math.cos(centerLat*Math.PI/180);
var homeHeight=Math.max(260000,Math.min(480000,Math.max(latSpan,lonSpan)*2200));

var mapInstance=null;
var viewerRef=null;
var originalTerrain=null;
var terrainOn=true;
var buildingLayer=null;
var buildingsOn=true;
var groupVisible={ASOS:true,AWS:true};
var groupEntities={ASOS:[],AWS:[]};
var uiReady=false;

function makeMarkerDataUrl(type){
  var c=document.createElement("canvas");
  c.width=44;c.height=44;
  var ctx=c.getContext("2d");
  ctx.clearRect(0,0,44,44);

  if(type==="ASOS"){
    ctx.beginPath();
    ctx.arc(22,22,10,0,Math.PI*2);
    ctx.fillStyle="#38bdf8";
    ctx.fill();
    ctx.lineWidth=3;
    ctx.strokeStyle="#ffffff";
    ctx.stroke();
  }else{
    ctx.save();
    ctx.translate(22,22);
    ctx.rotate(Math.PI/4);
    ctx.fillStyle="#fb923c";
    ctx.strokeStyle="#ffffff";
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.rect(-8,-8,16,16);
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }
  return c.toDataURL("image/png");
}

var markerImages={
  ASOS:makeMarkerDataUrl("ASOS"),
  AWS:makeMarkerDataUrl("AWS")
};

function updateStatus(customText){
  if(customText){
    byId("stationStatus").textContent=customText;
    return;
  }
  var visibleCount =
    (groupVisible.ASOS ? groupEntities.ASOS.length : 0) +
    (groupVisible.AWS ? groupEntities.AWS.length : 0);
  byId("stationStatus").textContent =
    "ASOS "+(groupVisible.ASOS ? "ON" : "OFF")+" ("+groupEntities.ASOS.length+") · "+
    "AWS "+(groupVisible.AWS ? "ON" : "OFF")+" ("+groupEntities.AWS.length+") · "+
    "표시 "+visibleCount+"개";
}

function updateGroupButton(type){
  var button=byId(type==="ASOS" ? "asosToggle" : "awsToggle");
  var on=groupVisible[type];
  button.textContent=type+" "+(on ? "ON" : "OFF");
  if(on) button.classList.add("on");
  else button.classList.remove("on");
}

function setGroupVisible(type,visible){
  groupVisible[type]=visible;
  groupEntities[type].forEach(function(entity){
    entity.show=visible;
  });
  updateGroupButton(type);
  updateStatus();
}

function resolveBuildingLayer(attempt){
  try{
    buildingLayer=mapInstance.getLayerElement("facility_build");
    if(buildingLayer){
      buildingLayer.show();
      buildingsOn=true;
      byId("buildingToggle").textContent="3D 건물 ON";
      byId("buildingToggle").classList.add("on");
      return;
    }
  }catch(e){
    console.warn("facility_build 확인 중:",e);
  }

  if(attempt<12){
    window.setTimeout(function(){resolveBuildingLayer(attempt+1);},500);
  }else{
    byId("buildingToggle").textContent="건물 레이어 대기";
    byId("buildingToggle").classList.remove("on");
  }
}

function addDropdownOptions(){
  var select=byId("stationSelect");

  ["ASOS","AWS"].forEach(function(type){
    var group=document.createElement("optgroup");
    group.label=type+" ("+(type==="ASOS" ? 17 : 60)+")";

    stations.filter(function(s){return s.type===type;}).forEach(function(s){
      var option=document.createElement("option");
      option.value=String(s.index);
      option.textContent=s.id+" · "+s.name;
      group.appendChild(option);
    });

    select.appendChild(group);
  });
}

function addStationEntity(s){
  var entity=viewerRef.entities.add({
    id:s.type.toLowerCase()+"-"+s.id,
    name:s.name,
    position:Cesium.Cartesian3.fromDegrees(s.lon,s.lat,0),

    billboard:{
      image:markerImages[s.type],
      width:s.type==="ASOS" ? 27 : 24,
      height:s.type==="ASOS" ? 27 : 24,
      verticalOrigin:Cesium.VerticalOrigin.CENTER,
      heightReference:Cesium.HeightReference.CLAMP_TO_GROUND,
      disableDepthTestDistance:Number.POSITIVE_INFINITY,
      scaleByDistance:new Cesium.NearFarScalar(
        1000,1.15,
        300000,0.45
      )
    },

    label:{
      text:s.id+" "+s.name,
      font:s.type==="ASOS" ? "700 13px Malgun Gothic" : "600 12px Malgun Gothic",
      fillColor:s.type==="ASOS"
        ? Cesium.Color.fromCssColorString("#e0f2fe")
        : Cesium.Color.fromCssColorString("#ffedd5"),
      outlineColor:Cesium.Color.BLACK,
      outlineWidth:3,
      style:Cesium.LabelStyle.FILL_AND_OUTLINE,
      pixelOffset:new Cesium.Cartesian2(0,-22),
      verticalOrigin:Cesium.VerticalOrigin.BOTTOM,
      heightReference:Cesium.HeightReference.CLAMP_TO_GROUND,
      disableDepthTestDistance:Number.POSITIVE_INFINITY,
      distanceDisplayCondition:new Cesium.DistanceDisplayCondition(
        0,
        s.type==="ASOS" ? 110000 : 65000
      )
    }
  });

  entity.__stationIndex=s.index;
  entity.__stationType=s.type;
  groupEntities[s.type].push(entity);
}

function flyHome(){
  viewerRef.camera.flyTo({
    destination:Cesium.Cartesian3.fromDegrees(centerLon,centerLat,homeHeight),
    orientation:{
      heading:Cesium.Math.toRadians(0),
      pitch:Cesium.Math.toRadians(-50),
      roll:0
    },
    duration:1.4
  });
}

function flyToStation(target){
  if(!groupVisible[target.type]){
    setGroupVisible(target.type,true);
  }

  viewerRef.camera.flyTo({
    destination:Cesium.Cartesian3.fromDegrees(target.lon,target.lat,1200),
    orientation:{
      heading:Cesium.Math.toRadians(20),
      pitch:Cesium.Math.toRadians(-32),
      roll:0
    },
    duration:1.6
  });
}

function openStationPopup(click,s){
  var badgeClass=s.type==="ASOS" ? "asos" : "aws";

  byId("stationPopupContent").innerHTML=
    "<b>"+escapeText(s.id+" · "+s.name)+"</b>"+
    '<span class="typeBadge '+badgeClass+'">'+escapeText(s.type)+"</span>"+
    "<table>"+
    "<tr><th>관측망</th><td>"+escapeText(s.type)+"</td></tr>"+
    "<tr><th>주소</th><td>"+escapeText(s.address)+"</td></tr>"+
    "<tr><th>위도</th><td>"+s.lat.toFixed(6)+"</td></tr>"+
    "<tr><th>경도</th><td>"+s.lon.toFixed(6)+"</td></tr>"+
    "<tr><th>높이</th><td>"+s.height.toFixed(2)+" m</td></tr>"+
    "</table>";

  var popup=byId("stationPopup");
  popup.style.display="block";
  popup.style.left=
    Math.max(8,Math.min(click.position.x+12,window.innerWidth-365))+"px";
  popup.style.top=
    Math.max(8,Math.min(click.position.y+12,window.innerHeight-250))+"px";
}

function installStationUi(){
  if(uiReady) return;
  uiReady=true;

  viewerRef=ws3d.viewer;
  originalTerrain=viewerRef.terrainProvider;

  // 화면 품질: 실제 원본 타일을 변경하지 않고 브라우저 렌더링 해상도만 활용
  try{
    viewerRef.resolutionScale=Math.min(window.devicePixelRatio || 1,2);
  }catch(e){
    console.warn("resolutionScale 적용 생략:",e);
  }

  resolveBuildingLayer(0);
  addDropdownOptions();

  stations.forEach(addStationEntity);

  byId("homeButton").addEventListener("click",flyHome);

  byId("stationSelect").addEventListener("change",function(e){
    var idx=Number(e.target.value);
    if(!Number.isFinite(idx)) return;
    var target=stations.filter(function(s){return s.index===idx;})[0];
    if(target) flyToStation(target);
  });

  byId("asosToggle").addEventListener("click",function(){
    setGroupVisible("ASOS",!groupVisible.ASOS);
  });

  byId("awsToggle").addEventListener("click",function(){
    setGroupVisible("AWS",!groupVisible.AWS);
  });

  byId("terrainToggle").addEventListener("click",function(){
    terrainOn=!terrainOn;
    viewerRef.terrainProvider=
      terrainOn ? originalTerrain : new Cesium.EllipsoidTerrainProvider();
    byId("terrainToggle").textContent="3D 지형 "+(terrainOn ? "ON" : "OFF");
    if(terrainOn) byId("terrainToggle").classList.add("on");
    else byId("terrainToggle").classList.remove("on");
  });

  byId("buildingToggle").addEventListener("click",function(){
    try{
      if(!buildingLayer){
        buildingLayer=mapInstance.getLayerElement("facility_build");
      }
      if(!buildingLayer){
        updateStatus("3D 건물 레이어가 아직 로드되지 않았습니다.");
        return;
      }

      buildingsOn=!buildingsOn;
      if(buildingsOn) buildingLayer.show();
      else buildingLayer.hide();

      byId("buildingToggle").textContent=
        "3D 건물 "+(buildingsOn ? "ON" : "OFF");
      if(buildingsOn) byId("buildingToggle").classList.add("on");
      else byId("buildingToggle").classList.remove("on");
      updateStatus();
    }catch(err){
      showError(err,"3D 건물 레이어 제어");
    }
  });

  byId("stationPopupClose").addEventListener("click",function(){
    byId("stationPopup").style.display="none";
  });

  var handler=new Cesium.ScreenSpaceEventHandler(viewerRef.scene.canvas);
  handler.setInputAction(function(click){
    byId("stationPopup").style.display="none";

    var picked=viewerRef.scene.pick(click.position);
    if(!Cesium.defined(picked) || !picked.id) return;

    var idx=Number(picked.id.__stationIndex);
    if(!Number.isFinite(idx)) return;

    var s=stations.filter(function(v){return v.index===idx;})[0];
    if(s) openStationPopup(click,s);
  },Cesium.ScreenSpaceEventType.LEFT_CLICK);

  updateGroupButton("ASOS");
  updateGroupButton("AWS");
  updateStatus();
  window.setTimeout(flyHome,500);
}

try{
  if(typeof vw==="undefined"){
    throw new Error("V-World API 스크립트가 로드되지 않았습니다.");
  }

  vw.ws3dInitCallBack=function(){
    try{
      installStationUi();
    }catch(err){
      showError(err,"ASOS·AWS 레이어 초기화");
    }
  };

  var mapOptions={
    mapId:"map",
    initPosition:new vw.CameraPosition(
      new vw.CoordZ(centerLon,centerLat,homeHeight),
      new vw.Direction(0,-90,0)
    ),
    logo:true,
    navigation:true
  };

  mapInstance=new vw.Map();
  mapInstance.setOption(mapOptions);
  mapInstance.start();

  // 일부 환경에서 콜백이 누락될 경우에만 안전하게 보조 초기화
  window.setTimeout(function(){
    try{
      if(!uiReady && typeof ws3d!=="undefined" && ws3d.viewer){
        installStationUi();
      }
    }catch(err){
      showError(err,"지연 초기화");
    }
  },1500);

}catch(err){
  showError(err,"V-World map.start()");
}
})();
</script>
</body>
</html>
